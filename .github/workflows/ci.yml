name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GTK dependencies
        if: ${{ !env.ACT }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            desktop-file-utils \
            pkg-config \
            libgtk-4-dev \
            libgraphene-1.0-dev \
            libgtk4-layer-shell-dev \
            libasound2-dev \
            xvfb

      - name: Verify local GTK dependencies (act)
        if: ${{ env.ACT }}
        run: |
          pkg-config --modversion gtk4
          pkg-config --modversion graphene-1.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Test workspace crates
        run: cargo test -p voxy-core -p voxy-audio -p voxy-stt -p voxy-app

      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Packaging metadata validation
        run: just validate-packaging-strict

      - name: GUI smoke and lifecycle flows (xvfb)
        if: ${{ !env.ACT }}
        run: |
          xvfb-run -a cargo run -p xtask -- gui smoke
          xvfb-run -a cargo run -p xtask -- gui lifecycle
          xvfb-run -a cargo run -p xtask -- gui quit-fallback
          xvfb-run -a cargo run -p xtask -- gui reset-flow
          xvfb-run -a cargo run -p xtask -- gui stt-fixture-smoke
          xvfb-run -a cargo run -p xtask -- gui visibility-toggle-flow
          xvfb-run -a cargo run -p xtask -- gui visibility-smoke
          xvfb-run -a cargo run -p xtask -- gui visibility-window-guard

      - name: GUI smoke and lifecycle flows (act host)
        if: ${{ env.ACT }}
        run: |
          cargo run -p xtask -- gui smoke
          cargo run -p xtask -- gui lifecycle
          cargo run -p xtask -- gui quit-fallback
          cargo run -p xtask -- gui reset-flow
          cargo run -p xtask -- gui stt-fixture-smoke
          cargo run -p xtask -- gui visibility-toggle-flow
          cargo run -p xtask -- gui visibility-smoke
          cargo run -p xtask -- gui visibility-window-guard

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: Dependency vulnerability scan
        run: cargo audit --ignore RUSTSEC-2025-0044

      - name: Dependency policy scan
        run: cargo deny check
