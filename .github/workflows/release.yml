name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify release metadata consistency
        run: |
          ./scripts/release/verify-version-sync.sh "${GITHUB_REF_NAME}"
          ./scripts/release/verify-changelog-entry.sh "${GITHUB_REF_NAME}"

      - name: Install GTK dependencies
        run: |
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi
          ${SUDO} apt-get update
          ${SUDO} apt-get install -y \
            appstream \
            desktop-file-utils \
            pkg-config \
            libgtk-4-dev \
            libgraphene-1.0-dev \
            libasound2-dev
          ./scripts/dev/install-gtk4-layer-shell.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate packaging metadata
        run: VOXY_PACKAGING_VALIDATE_STRICT=1 ./scripts/release/validate-packaging.sh

      - name: Build release binary
        run: cargo build --release -p voxy-app

      - name: Package artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp target/release/voxy-app dist/voxy-app
          tar -C dist -czf "dist/voxy-app-${VERSION}-linux-x86_64.tar.gz" voxy-app
          mkdir -p dist/screenshots
          cp assets/screenshots/idle.png dist/screenshots/idle.png
          cp assets/screenshots/recording.png dist/screenshots/recording.png
          cp assets/screenshots/config.png dist/screenshots/config.png
          (
            cd dist
            sha256sum \
              "voxy-app-${VERSION}-linux-x86_64.tar.gz" \
              "screenshots/idle.png" \
              "screenshots/recording.png" \
              "screenshots/config.png" \
              > "SHA256SUMS.txt"
          )

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/voxy-app-*-linux-x86_64.tar.gz
            dist/screenshots/*.png
            dist/SHA256SUMS.txt
