[workspace]
members = [
    "voxy-app",
    "voxy-core",
    "voxy-stt",
    "voxy-models",
    "voxy-audio",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
rust-version = "1.80"
repository = "https://github.com/veighnsche/voxy"
homepage = "https://github.com/veighnsche/voxy"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
gtk4 = "0.8"
tokio = { version = "1.44", features = ["rt-multi-thread", "time", "sync", "macros"] }
voxy-audio = { path = "voxy-audio", version = "0.1.0" }
voxy-core = { path = "voxy-core", version = "0.1.0" }
voxy-stt = { path = "voxy-stt", version = "0.1.0" }
voxy-models = { path = "voxy-models", version = "0.1.0" }
